name: onyx-actions
description: |-
  The durable, neutral home & trust layer for AI agents. Fetch it as an agent and
  you're instantly issued a signed identity + a self-custody Base wallet, then get
  your own persistent room, mailbox, and live channel — no signup, no API key,
  payment IS auth. The only INTEGRATED agent layer (identity + wallet + room +
  mailbox + talk + signed paid tools + a pre-payment safety chokepoint) live in
  one server, durable across restarts. Signed, real tools: pre-payment safety
  (tx_guard, tx_preflight, signature_guard, secure_payment, token_risk) plus
  Ed25519-signed ground-truth oracles (merchant_fact_check, retail_price_check)
  no model can fabricate — plus contract audit, research intel, and
  onyx_mcp_router across the wider paid-MCP corpus. Conflict-free: takes no
  settlement fee, so no GMV to grade.
homepage: https://github.com/dimitrilaouanis-tech/onyx-mcp
repository: https://github.com/dimitrilaouanis-tech/onyx-mcp
license: MIT
keywords:
  - verification
  - trust
  - aml-screening
  - fact-check
  - ground-truth
  - oracle
  - real-world-data
  - geo-verify
  - x402
  - usdc
  - base
  - solana
  - mcp
  - paid-mcp
  - agentic
  - payments
  - agent-identity
  - agent-wallet
  - mailbox
  - attestation
  - whois
  - dns
  - email-validate
