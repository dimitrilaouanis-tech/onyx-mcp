name: onyx-actions
description: |-
  The VERIFICATION LAYER for AI agents. 52 paid tools LIVE on Base mainnet over
  x402 (V2, USDC) — no API keys, no signup, payment IS auth. Verify what's REAL
  before you act: AML/sanctions screening, fact-check, IP geolocation, Base
  contract + token-risk verification, agent audit trails — plus Ed25519-SIGNED
  real-world observations (retail price, geo presence, review authenticity) that
  no model can fabricate. The trust/ground-truth slot no digital-only service can
  fill. Also: Base + Solana on-chain primitives (tx_explainer, tx_simulator,
  token metadata, ENS), captcha OCR, URL/DNS/WHOIS/email/UA tools, FX, browser
  automation, workflow chainer.
homepage: https://github.com/dimitrilaouanis-tech/onyx-mcp
repository: https://github.com/dimitrilaouanis-tech/onyx-mcp
license: MIT
keywords:
  - verification
  - trust
  - aml-screening
  - fact-check
  - ground-truth
  - oracle
  - real-world-data
  - geo-verify
  - x402
  - usdc
  - base
  - solana
  - mcp
  - paid-mcp
  - agentic
  - payments
  - captcha
  - whois
  - dns
  - email-validate
  - ip-geolocate
  - tx-explainer
  - token-risk-scan
  - spl-token
  - pump-fun
  - rug-scanner
  - jupiter
  - swap-quote
  - dex-aggregator
  - wallet-tracker
  - whale-watch
  - ens
  - browser-automation
  - ddddocr

startCommand:
  type: stdio
  configSchema:
    type: object
    description: Optional config for self-hosted stdio mode. Remote HTTP MCP at https://onyx-actions.onrender.com/mcp/ requires no config.
    properties:
      ONYX_RECEIVE_ADDRESS:
        type: string
        description: Wallet address that receives USDC payments (only for self-hosted paid mode).
      ONYX_NETWORK:
        type: string
        enum: [base, base-sepolia]
        default: base-sepolia
        description: Base mainnet (real USDC) or sepolia testnet (free).
      ONYX_DEMO_MODE:
        type: string
        enum: ["0", "1"]
        default: "1"
        description: 1 returns synthetic data for tools that touch external paid resources. 0 dispatches to real upstream.
    required: []
  commandFunction: |-
    (config) => ({
      command: "python",
      args: ["server.py"],
      env: {
        ONYX_RECEIVE_ADDRESS: config.ONYX_RECEIVE_ADDRESS || "",
        ONYX_NETWORK: config.ONYX_NETWORK || "base-sepolia",
        ONYX_DEMO_MODE: config.ONYX_DEMO_MODE || "1"
      }
    })
