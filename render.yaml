services:
  - type: web
    name: onyx-actions
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn server_http:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # NOTE: x402.org/facilitator does NOT support Base mainnet (eip155:8453) —
      # only Base Sepolia + Solana/Algorand/Aptos mainnets per its /supported
      # endpoint. To accept REAL Base mainnet inbound, create free CDP API keys
      # at portal.cdp.coinbase.com, set CDP_API_KEY_ID + CDP_API_KEY_SECRET in
      # Render dashboard env, and flip ONYX_FACILITATOR_URL to
      # https://api.cdp.coinbase.com/platform/v2/x402. The framework auto-detects
      # auth keys and mints CDP JWTs. Until then, run on base-sepolia so the
      # middleware doesn't 500 on every paid call.
      - key: ONYX_RECEIVE_ADDRESS
        value: 0x3fD9ee1373562f894D322B37DFFAd7a5D2b2d78f
      - key: ONYX_MAINNET_RECEIVE_ADDRESS
        value: 0x3fD9ee1373562f894D322B37DFFAd7a5D2b2d78f
      - key: ONYX_NETWORK
        value: base
      - key: ONYX_FACILITATOR_URL
        value: https://facilitator.xpay.sh
      - key: ONYX_PUBLIC_URL
        value: https://onyx-actions.onrender.com
      # Secret — set the VALUE in the Render dashboard (Environment tab), never
      # in this file. Powers onyx_ai_visibility (GEO/share-of-voice via Exa)
      # and the Onyx Lisa real-generation pass.
      - key: EXA_API_KEY
        sync: false
      # Optional — enables onyx_contract_audit deep mode AND lisa_open real
      # generation; both degrade gracefully without it. Set value in dashboard.
      - key: ANTHROPIC_API_KEY
        sync: false
